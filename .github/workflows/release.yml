name: Release APK

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version, e.g. 1.2.3; leave empty for YYYY.MM.DD.RUN'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./gradlew --quiet :app:printReleaseVersionCode > "$RUNNER_TEMP/version-code.txt"
          python3 scripts/release_version.py \
            --base-code "$(cat "$RUNNER_TEMP/version-code.txt")" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --version "$RELEASE_VERSION" \
            --output "$GITHUB_OUTPUT"

      - name: Refuse an existing release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists; choose a new version."
            exit 1
          fi

      - name: Test
        run: |
          python3 -m unittest discover -s scripts/tests -v
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See docs/releases.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          APK_VERSION: ${{ steps.version.outputs.version }}
          APK_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PreleaseVersionName="$APK_VERSION" \
            -PreleaseVersionCode="$APK_VERSION_CODE"

      - name: Verify and name the APK
        id: apk
        env:
          APK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          mkdir -p app/build/release-assets
          output="app/build/release-assets/openwnn-korean-$APK_VERSION.apk"
          cp "$apk" "$output"
          (
            cd app/build/release-assets
            sha256sum "openwnn-korean-$APK_VERSION.apk" > "openwnn-korean-$APK_VERSION.apk.sha256"
          )
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Save the APK as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwnn-korean-${{ steps.version.outputs.version }}
          path: app/build/release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Create the tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_PATH" "$APK_PATH.sha256" \
            --target "$GITHUB_SHA" \
            --title "OpenWnn Korean $RELEASE_TAG" \
            --generate-notes

      - name: Remove the temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
